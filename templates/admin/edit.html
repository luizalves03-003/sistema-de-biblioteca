{% extends "admin/base.html" %}

{% block content %}
          
          <main class="app-main">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3 m-0">Editar Livro</h1>
                <a href="/livros" class="btn btn-info bi bi-arrow-left"></a>
            </div>

            <!-- Formulário de Edição -->
            <form action="/edit/{{ livro.id }}" method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
                
                <div class="mb-3">
                    <label for="titulo" class="form-label">Título:</label>
                    <input type="text" class="form-control" id="titulo" name="titulo" value="{{ livro.titulo }}" required>
                </div>

                <div class="mb-3">
                    <label for="autor" class="form-label">Autor:</label>
                    <input type="text" class="form-control" id="autor" name="autor" value="{{ livro.autor }}" required>
                </div>

                <div class="mb-3">
                    <label for="genero" class="form-label">Gênero:</label>
                    <input type="text" class="form-control" id="genero" name="genero" value="{{ livro.genero }}" required>
                </div>

                <div class="mb-3">    
                    <label for="lancado" class="form-label">Lançado (Ano):</label>
                    <input type="number" class="form-control" id="lancado" name="lancado" value="{{ livro.lancado }}" required>
                </div>

                <div class="mb-3">
                    <label for="imagem" class="form-label">Capa Atual:</label>
                    <div class="mb-2">
                        {% if livro.imagem %}
                            <img src="{{ url_for('static', filename=livro.imagem) }}" style="max-width: 200px; max-height: 200px;" alt="{{ livro.titulo }}" class="img-thumbnail">
                        {% else %}
                            <span class="text-muted">Nenhuma imagem cadastrada</span>
                        {% endif %}
                    </div>
                    <label for="imagem" class="form-label">Alterar Capa:</label>
                    <input type="file" class="form-control" id="imagem" name="imagem" accept="image/png,image/jpeg,image/gif,image/webp">
                </div>

                <button type="submit" class="btn btn-primary" onclick="return confirm('Realmente deseja alterar esse livro?')">Alterar Livro</button>
            </form>

          </main>

{% endblock %}
