{% extends "admin/base.html" %}



{% block content  %}

    <main class="app-main">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 m-0">Adicionar Livro</h1>
            <a href="/livros"><button type="button" class="btn btn-info  bi bi-arrow-left"></button></a>
        </div>
    
        <form action="/add_livro" method="POST">
            <div class="form-group">
                <label for="titulo">Título:</label>
                <input type="text" class="form-control" id="titulo" name="titulo" required>
            </div>
            <div class="form-group">
                <label for="autor">Autor:</label>
                <input type="text" class="form-control" id="autor" name="autor" required>
            </div>
            <div class="form-group">
                <label for="genero">Gênero:</label>
                <input type="text" class="form-control" id="genero" name="genero" required>
            </div>
            <div class="form-group">    
                <label for="lancado">Lançado:</label>
                <input type="integer" class="form-control" id="lancado" name="lancado" required>
            </div>
            <button type="submit" class="btn btn-primary">Adicionar Livro</button>
        </form>
  </main>

{% endblock %}
